<!DOCTYPE html>
<html lang="de" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salonplafond BAR v3.0.0</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS pre Excel Import -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    body.dark-mode { background-color: #0f172a; color: #f8fafc; }
    body.dark-mode .card { background-color: #1e293b; border-color: #334155; }
    body.light-mode { background-color: #f1f5f9; color: #0f172a; }
    body.light-mode .card { background-color: #ffffff; border-color: #e2e8f0; }

    .drink-icon-spin {
      display: inline-block;
      transition: transform 0.4s ease-in-out;
    }
    .drink-icon-spin:hover {
      transform: rotate(360deg) scale(1.25);
    }
  </style>
</head>
<body class="dark-mode min-h-screen pb-12 transition-colors duration-200">

  <!-- 1. PRIHLASOVACIA OBRAZOVKA (AUTH LOCK) -->
  <div id="authContainer" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950">
    <div class="card w-full max-w-md p-6 rounded-2xl shadow-2xl border text-center space-y-6 bg-slate-900 border-slate-800">
      <div>
        <div id="authLogoIcon" class="text-6xl mb-2 cursor-pointer drink-icon-spin" onclick="rotateLogoIcon()">🍸</div>
        <h1 class="text-2xl font-black tracking-wider text-amber-500 uppercase">Salonplafond BAR</h1>
        <p class="text-xs text-slate-400 mt-1">Anmeldung erforderlich (v3.0.0)</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold uppercase mb-1 opacity-80 text-slate-300">E-Mail</label>
          <input type="email" id="loginEmail" required placeholder="amim@salonplafond.wien" class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-slate-800 text-white border border-slate-700">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase mb-1 opacity-80 text-slate-300">Passwort</label>
          <input type="password" id="loginPassword" required class="w-full p-3 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 text-sm bg-slate-800 text-white border border-slate-700">
        </div>
        <div id="authError" class="text-xs text-red-400 hidden font-medium"></div>
        <button type="submit" id="btnLogin" class="w-full py-3 bg-amber-500 hover:bg-amber-600 active:scale-[0.99] text-slate-950 font-extrabold rounded-xl transition shadow-lg">
          Einloggen
        </button>
      </form>
    </div>
  </div>

  <!-- 2. HLAVNÁ APLIKÁCIA -->
  <div id="appContainer" class="hidden max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- HEADER -->
    <header class="flex items-center justify-between border-b border-slate-700/50 pb-4">
      <div class="flex items-center space-x-3">
        <span id="appLogoIcon" class="text-3xl cursor-pointer drink-icon-spin" onclick="rotateLogoIcon()">🍸</span>
        <div>
          <h1 class="text-xl font-black text-amber-500 tracking-wider">Salonplafond BAR</h1>
          <p id="userStatus" class="text-xs opacity-70">Angemeldet: <span id="currentUserEmail" class="font-semibold text-amber-400"></span></p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="toggleDarkMode()" class="p-2 rounded-xl card border hover:opacity-80 text-sm">🌙 / ☀️</button>
        <button onclick="handleLogout()" class="px-3 py-2 bg-red-600/80 hover:bg-red-600 text-white font-bold text-xs rounded-xl transition">Abmelden</button>
      </div>
    </header>

    <!-- MOTIVAČNÝ BANNER (EASTER EGG) -->
    <div id="motivationalBanner" class="p-3 bg-gradient-to-r from-amber-500/20 to-amber-700/20 border border-amber-500/30 rounded-xl text-center text-sm font-medium text-amber-300">
      🍹 Shake it till you make it! 
    </div>

    <!-- SEZÓNY & SEARCH -->
    <div class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <select id="seasonSelect" onchange="filterDrinks()" class="p-3 rounded-xl card border font-semibold text-sm outline-none focus:ring-2 focus:ring-amber-500 flex-1 bg-slate-800 text-white">
          <option value="16.11.2026 - 16.03.2027">Winterkarte (16.11.2026 - 16.03.2027)</option>
          <option value="Sommer 2026">Sommerkarte 2026</option>
          <option value="ALL">Alle Saisons</option>
        </select>
        <input type="text" id="searchInput" oninput="filterDrinks()" placeholder="Drink oder Zutaten suchen..." class="p-3 rounded-xl card border text-sm outline-none focus:ring-2 focus:ring-amber-500 flex-2 bg-slate-800 text-white">
      </div>
    </div>

    <!-- MOŽNOSTI MANAŽÉRA & AKCIE -->
    <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-700/40">
      <button id="btnManagerMode" onclick="toggleManagerMode()" class="px-3 py-2 bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 border border-amber-500/40 text-xs font-bold rounded-xl transition">🔑 Manager-Modus</button>
      <button id="btnImportExcel" onclick="triggerExcelImport()" class="hidden px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition">📥 Winterkarte 2026 Excel Importieren</button>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelImport(event)">
    </div>

    <!-- ZOZNAM DRINKOV -->
    <div id="drinksList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <!-- Načítané drinky -->
    </div>

  </div>

  <!-- MODAL: DETAIL DRINKU -->
  <div id="drinkDetailModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="card w-full max-w-lg p-6 rounded-2xl shadow-2xl border space-y-4 max-h-[90vh] overflow-y-auto bg-slate-900 border-slate-700">
      <div class="flex justify-between items-start">
        <h2 id="detailName" class="text-2xl font-black text-amber-500"></h2>
        <span id="detailCategory" class="px-2.5 py-1 bg-amber-500/20 text-amber-400 text-xs font-bold rounded-lg border border-amber-500/30"></span>
      </div>

      <div class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-2 p-3 bg-slate-800/60 rounded-xl border border-slate-700/50">
          <div><span class="text-xs opacity-60 uppercase block">Glas</span> <strong id="detailGlass">-</strong></div>
          <div><span class="text-xs opacity-60 uppercase block">Methode</span> <strong id="detailMethod">-</strong></div>
          <div class="col-span-2"><span class="text-xs opacity-60 uppercase block">Eis</span> <strong id="detailIce">-</strong></div>
        </div>

        <div>
          <h4 class="text-xs font-bold uppercase text-amber-400 mb-1">Zutaten</h4>
          <ul id="detailIngredients" class="space-y-1 pl-1"></ul>
        </div>

        <div>
          <h4 class="text-xs font-bold uppercase text-amber-400 mb-1">Garnitur</h4>
          <p id="detailGarnish" class="text-sm font-medium opacity-90"></p>
        </div>

        <div>
          <h4 class="text-xs font-bold uppercase text-amber-400 mb-1">Zubereitung</h4>
          <p id="detailPreparation" class="text-sm whitespace-pre-line opacity-90"></p>
        </div>

        <div id="managerCostSection" class="hidden p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl space-y-1">
          <div class="flex justify-between text-xs"><span>Verkaufspreis:</span> <strong id="detailPrice">-</strong></div>
          <div class="flex justify-between text-xs"><span>Wareneinsatz:</span> <strong id="detailCost">-</strong></div>
        </div>
      </div>

      <!-- VYLEPŠENÉ VÝRAZNÉ TLAČIDLO SCHLIEßEN -->
      <div class="pt-4 border-t border-slate-700/50 space-y-3">
        <button onclick="closeDrinkDetail()" class="w-full py-3.5 bg-slate-800 hover:bg-slate-700 active:scale-[0.99] text-amber-400 font-extrabold text-sm rounded-xl border-2 border-amber-500/50 transition shadow-lg tracking-wide">
          ✕ Schließen
        </button>
      </div>
    </div>
  </div>

  <script>
    // SUPABASE PRIPOJENIE
    const SUPABASE_URL = "https://asrrkjcxqqvxzlikdkaq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2tw50zmlzxDClPx7zwnT3g_k2WiaUuL";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const LOGO_ICONS = ["🍸", "🍹", "🥂", "🥃", "🍷", "🍺"];
    let currentIconIdx = 0;
    let allDrinks = [];
    let isManager = false;

    const MOTIVATIONAL_PHRASES = [
      "🍹 Shake it till you make it!",
      "❄️ Bereit für die Wintersaison 16.11.2026 - 16.03.2027!",
      "🥂 Lächeln, einschenken, glänzen!",
      "🍋 Vergiss die Garnitur nicht!",
      "🔥 Ein gutes Team macht die besten Drinks!",
      "🧊 Immer genug Eis im Bin behalten!"
    ];

    function rotateLogoIcon() {
      currentIconIdx = (currentIconIdx + 1) % LOGO_ICONS.length;
      document.getElementById("authLogoIcon").innerText = LOGO_ICONS[currentIconIdx];
      document.getElementById("appLogoIcon").innerText = LOGO_ICONS[currentIconIdx];
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showApp(session.user);
      }
      setRandomMotivationalPhrase();
    });

    function setRandomMotivationalPhrase() {
      const phrase = MOTIVATIONAL_PHRASES[Math.floor(Math.random() * MOTIVATIONAL_PHRASES.length)];
      document.getElementById("motivationalBanner").innerText = phrase;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const errDiv = document.getElementById("authError");
      errDiv.classList.add("hidden");

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        errDiv.innerText = "Fehler: " + error.message;
        errDiv.classList.remove("hidden");
      } else {
        showApp(data.user);
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      document.getElementById("appContainer").classList.add("hidden");
      document.getElementById("authContainer").classList.remove("hidden");
    }

    function showApp(user) {
      document.getElementById("authContainer").classList.add("hidden");
      document.getElementById("appContainer").classList.remove("hidden");
      document.getElementById("currentUserEmail").innerText = user.email;
      
      if (user.email.includes("amim") || user.email.includes("manager")) {
        isManager = true;
        toggleManagerModeUI(true);
      } else {
        isManager = false;
        toggleManagerModeUI(false);
      }

      fetchDrinks();
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode");
    }

    function toggleManagerMode() {
      isManager = !isManager;
      toggleManagerModeUI(isManager);
      filterDrinks();
    }

    function toggleManagerModeUI(active) {
      const btn = document.getElementById("btnManagerMode");
      const btnImport = document.getElementById("btnImportExcel");
      if (active) {
        btn.classList.add("bg-amber-500", "text-slate-950");
        btnImport.classList.remove("hidden");
      } else {
        btn.classList.remove("bg-amber-500", "text-slate-950");
        btnImport.classList.add("hidden");
      }
    }

    async function fetchDrinks() {
      const { data, error } = await supabase.from("drinks").select("*");
      if (!error && data) {
        allDrinks = data;
        filterDrinks();
      }
    }

    function filterDrinks() {
      const seasonVal = document.getElementById("seasonSelect").value;
      const searchVal = document.getElementById("searchInput").value.toLowerCase();

      let filtered = allDrinks.filter(drink => {
        const matchesSeason = seasonVal === "ALL" || (drink.season && drink.season === seasonVal);
        const matchesSearch = drink.name.toLowerCase().includes(searchVal) || 
                              (drink.ingredients_json && JSON.stringify(drink.ingredients_json).toLowerCase().includes(searchVal));
        return matchesSeason && matchesSearch;
      });

      renderDrinks(filtered);
    }

    function renderDrinks(drinks) {
      const container = document.getElementById("drinksList");
      container.innerHTML = "";

      if (drinks.length === 0) {
        container.innerHTML = `<p class="col-span-2 text-center text-sm opacity-60 py-8">Keine Drinks für diese Auswahl gefunden.</p>`;
        return;
      }

      drinks.forEach(drink => {
        const card = document.createElement("div");
        card.className = "card p-4 rounded-xl border cursor-pointer hover:border-amber-500/50 transition flex justify-between items-center bg-slate-800/80 border-slate-700";
        card.onclick = () => openDrinkDetail(drink);
        card.innerHTML = `
          <div>
            <h3 class="font-bold text-base text-amber-400">${drink.name}</h3>
            <p class="text-xs opacity-60">${drink.category || 'Cocktail'} • ${drink.glass_type || '-'}</p>
          </div>
          <span class="text-xs px-2 py-1 bg-slate-700/80 rounded-lg font-mono text-amber-300">${drink.selling_price ? '€ ' + drink.selling_price : ''}</span>
        `;
        container.appendChild(card);
      });
    }

    function openDrinkDetail(drink) {
      document.getElementById("detailName").innerText = drink.name;
      document.getElementById("detailCategory").innerText = drink.category || "Cocktail";
      document.getElementById("detailGlass").innerText = drink.glass_type || "-";
      document.getElementById("detailMethod").innerText = drink.method || "-";
      document.getElementById("detailIce").innerText = drink.ice || "-";
      document.getElementById("detailGarnish").innerText = drink.garnish || "-";
      document.getElementById("detailPreparation").innerText = drink.recipe || "Keine Zubereitung angegeben.";

      const ingList = document.getElementById("detailIngredients");
      ingList.innerHTML = "";
      
      let ings = drink.ingredients_json;
      if (typeof ings === "string") {
        try { ings = JSON.parse(ings); } catch(e){}
      }

      if (Array.isArray(ings)) {
        ings.forEach(i => {
          ingList.innerHTML += `<li class="text-xs opacity-90">• <strong>${i.amount || ''}</strong> ${i.name || i}</li>`;
        });
      } else if (ings) {
        ingList.innerHTML = `<li class="text-xs opacity-90">${ings}</li>`;
      }

      if (isManager) {
        document.getElementById("managerCostSection").classList.remove("hidden");
        document.getElementById("detailPrice").innerText = drink.selling_price ? '€ ' + drink.selling_price : '-';
        document.getElementById("detailCost").innerText = drink.cost_price ? '€ ' + drink.cost_price : '-';
      } else {
        document.getElementById("managerCostSection").classList.add("hidden");
      }

      document.getElementById("drinkDetailModal").classList.remove("hidden");
    }

    function closeDrinkDetail() {
      document.getElementById("drinkDetailModal").classList.add("hidden");
    }

    function triggerExcelImport() {
      document.getElementById("excelFileInput").click();
    }

    function handleExcelImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const importedSeason = "16.11.2026 - 16.03.2027";
        let parsedDrinks = [];
        let currentDrink = null;
        let currentCat = "Cocktails";

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;

          const col0 = row[0] ? String(row[0]).trim() : "";
          const col1 = row[1] ? String(row[1]).trim() : "";

          if (["APERITTIF", "MOCKTAILS", "Cocktails", "After Dinner Drinks", "Salonplafond Classic"].includes(col1)) {
            currentCat = col1;
            continue;
          }

          if (col0.startsWith("Glass:")) {
            if (currentDrink) {
              currentDrink.glass_type = col0.replace("Glass:", "").trim();
              if (col1.startsWith("Method:")) currentDrink.method = col1.replace("Method:", "").trim();
            }
            continue;
          }

          if (col0.startsWith("Ice:")) {
            if (currentDrink) currentDrink.ice = col0.replace("Ice:", "").trim();
            continue;
          }

          if (col0 === "Garnish:") continue;

          if (col1.startsWith("Preis")) {
            if (currentDrink) {
              currentDrink.garnish = col0;
              currentDrink.selling_price = col1.replace("Preis", "").replace(",", ".").trim();
              parsedDrinks.push(currentDrink);
              currentDrink = null;
            }
            continue;
          }

          if (col0 && !col0.startsWith("Ingredients:") && !currentDrink) {
            currentDrink = {
              name: col0,
              category: currentCat,
              season: importedSeason,
              ingredients_json: [],
              is_active: true
            };
            continue;
          }

          if (currentDrink && col0 && col0 !== "Ingredients:") {
            currentDrink.ingredients_json.push({ name: col0, amount: col1 });
          }
        }

        if (parsedDrinks.length > 0) {
          const { error } = await supabase.from("drinks").insert(parsedDrinks);
          if (error) {
            alert("Fehler beim Import: " + error.message);
          } else {
            alert(`Erfolg! ${parsedDrinks.length} Drinks für die Wintersaison importiert.`);
            fetchDrinks();
          }
        } else {
          alert("Keine Drinks in der Datei gefunden.");
        }
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
