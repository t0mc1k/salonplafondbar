<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salonplafond BAR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #f59e0b; }
    .list-item { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; transition: background 0.2s; }
    .list-item:hover { background: #334155; border-color: #f59e0b; }
    
    /* Professional Print / PDF Styles */
    @media print {
      @page { size: portrait; margin: 10mm; }
      body { background: white !important; color: black !important; padding: 0 !important; }
      body > *:not(#drinkModal) { display: none !important; }
      #drinkModal {
        position: absolute !important;
        inset: 0 !important;
        background: white !important;
        display: flex !important;
        align-items: flex-start !important;
        justify-content: center !important;
        padding: 0 !important;
        z-index: 99999 !important;
        overflow: visible !important;
      }
      #drinkModal > div {
        background: white !important;
        border: none !important;
        box-shadow: none !important;
        max-height: none !important;
        width: 100% !important;
        padding: 0 !important;
        color: black !important;
      }
      #modalContent { color: black !important; }
      #modalContent h2 { color: black !important; }
      #modalContent .print-box { background: #f8fafc !important; border: 1px solid #cbd5e1 !important; color: black !important; }
      #modalContent .print-box p, #modalContent .print-box span { color: #1e293b !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto pb-24">

  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 pb-4 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <!-- Salonplafond Stylized Logo -->
      <div class="w-12 h-12 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg p-2 text-slate-950 font-bold text-2xl select-none">
        Ō
      </div>
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-amber-400">Salonplafond BAR</h1>
        <span class="text-xs text-slate-400 font-medium">Erstellt von © T0mc1k (Tomas Kardos)</span>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <!-- View Layout Toggle (Grid / List) -->
      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
        <button onclick="setViewMode('grid')" id="viewGrid" class="px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950 flex items-center gap-1">🖼️ Grid</button>
        <button onclick="setViewMode('list')" id="viewList" class="px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white flex items-center gap-1">☰ Liste</button>
      </div>

      <!-- Export CSV Button -->
      <button onclick="exportToCSV()" id="exportCsvBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold border border-slate-700 text-slate-300 flex items-center gap-1">
        📊 <span id="exportText">Export CSV</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button onclick="toggleFullscreen()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold border border-slate-700 text-slate-300 flex items-center gap-1">
        ⛶ <span id="fsText">Vollbild</span>
      </button>

      <!-- Language Toggle -->
      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
        <button onclick="setLang('de')" id="langDe" class="px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950">DE</button>
        <button onclick="setLang('en')" id="langEn" class="px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white">EN</button>
      </div>

      <!-- Search Box with Clear Button (x) -->
      <div class="relative w-48 md:w-64">
        <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="🔍 Suchen..." class="px-4 py-2 pr-8 rounded-lg bg-slate-800 border border-slate-700 text-white w-full focus:outline-none focus:border-amber-400 text-sm">
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm font-bold bg-slate-700/50 hover:bg-slate-700 w-5 h-5 rounded-full items-center justify-center">&times;</button>
      </div>

      <button onclick="toggleMode()" id="modeBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold border border-slate-600">Modus: Kellner</button>
    </div>
  </header>

  <p id="subTitle" class="text-sm text-slate-400 mb-6 -mt-4">Salonplafond • Rezepte & Getränkehandbuch</p>

  <!-- Categories & Special Filters -->
  <div class="flex flex-col gap-3 mb-6">
    <div class="flex items-center gap-2 overflow-x-auto pb-2">
      <span class="text-xs text-slate-400 font-semibold mr-1 shrink-0" id="catLabel">Kategorie:</span>
      <div id="categories" class="flex gap-2"></div>
    </div>
    <div class="flex gap-2 items-center overflow-x-auto text-xs">
      <span class="text-slate-400 font-semibold mr-1 shrink-0" id="filterLabel">Filter:</span>
      <button onclick="toggleSpecialFilter('featured')" id="filterFeatured" class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 flex items-center gap-1 whitespace-nowrap">⭐ TOP / Highlight</button>
      <button onclick="toggleSpecialFilter('vegan')" id="filterVegan" class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 whitespace-nowrap">🌱 Vegan</button>
      <button onclick="toggleSpecialFilter('glutenfree')" id="filterGluten" class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 whitespace-nowrap">🌾 Glutenfrei</button>
      <button onclick="toggleSpecialFilter('lactosefree')" id="filterLactose" class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 whitespace-nowrap">🥛 Laktosefrei</button>
      <button onclick="toggleSpecialFilter('nonalcoholic')" id="filterNonAlc" class="px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 whitespace-nowrap">🚫 Alkoholfrei</button>
    </div>
  </div>

  <!-- Manager Add / Edit Form -->
  <div id="adminForm" class="hidden card p-6 mb-8 border-amber-500/50">
    <h2 id="formTitle" class="text-xl font-bold mb-4 text-amber-400">➕ Neues Getränk hinzufügen</h2>
    <input type="hidden" id="editingId" value="">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="text" id="dName" placeholder="Getränkename (z. B. Aperol Spritz)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2">
      
      <!-- Category Selection Radios -->
      <div class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col gap-2">
        <label class="text-xs text-slate-400 font-semibold" id="catSelectLabel">🏷️ Kategorie auswählen:</label>
        <div class="flex flex-wrap gap-4 text-xs text-slate-200" id="categoryRadios">
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="dCatRadio" value="Cocktails & Spritz" class="accent-amber-500"> Cocktails & Spritz</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="dCatRadio" value="Kaffee" class="accent-amber-500"> Kaffee</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="dCatRadio" value="Longdrinks" class="accent-amber-500"> Longdrinks</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="dCatRadio" value="Alkoholfrei" class="accent-amber-500"> Alkoholfrei</label>
        </div>
      </div>

      <!-- Glass Type Selection -->
      <div class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col gap-2">
        <label class="text-xs text-slate-400 font-semibold" id="glassLabel">🍸 Glas-Typ / Ausrüstung:</label>
        <select id="dGlass" class="p-3 rounded bg-slate-950 border border-slate-800 text-white text-xs">
          <option value="">-- Glas auswählen --</option>
          <option value="Highballglas">Highballglas</option>
          <option value="Tumbler">Tumbler</option>
          <option value="Coupette">Coupette</option>
          <option value="Longdrinkglas">Longdrinkglas</option>
          <option value="Weinglas">Weinglas</option>
          <option value="Kaffeetasse">Kaffeetasse</option>
        </select>
      </div>

      <!-- Food Cost / Prices (Manager Only) -->
      <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div>
          <label class="text-xs text-slate-400 font-semibold mb-1 block" id="costLabel">💶 Wareneinsatz (€):</label>
          <input type="number" step="0.10" id="dCost" placeholder="0.00" class="p-3 rounded bg-slate-950 border border-slate-800 text-white w-full text-xs">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-semibold mb-1 block" id="priceLabel">🏷️ Verkaufspreis (€):</label>
          <input type="number" step="0.10" id="dPrice" placeholder="0.00" class="p-3 rounded bg-slate-950 border border-slate-800 text-white w-full text-xs">
        </div>
      </div>

      <!-- Supabase Photo Upload Section -->
      <div class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col gap-2">
        <label class="text-xs text-slate-400 font-semibold" id="photoLabel">📸 Foto des Getränks (Direkt hochladen oder URL eingeben):</label>
        <div class="flex gap-2 items-center">
          <input type="file" id="imageFile" accept="image/*" onchange="uploadImageToSupabase(event)" class="text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 cursor-pointer">
          <span id="uploadStatus" class="text-xs text-amber-400 font-medium"></span>
        </div>
        <input type="text" id="dPhoto" placeholder="Bild-URL (wird automatisch generiert oder manuell)" class="p-3 rounded bg-slate-950 border border-slate-800 text-white text-xs mt-1">
      </div>

      <textarea id="dIng" placeholder="Zutaten (z. B. 6 cl Prosecco, 4 cl Aperol, 2 cl Soda)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2"></textarea>
      
      <!-- Allergens & Dietary Checkboxes Grouped Together -->
      <div class="md:col-span-2 flex flex-col gap-2">
        <textarea id="dAllergens" placeholder="Allergene (z. B. Enthält Sulfite...)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white w-full"></textarea>
        <div class="flex flex-wrap gap-4 p-3 bg-slate-900 rounded border border-slate-800 text-xs text-slate-300">
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="dVegan" class="accent-amber-500"> 🌱 Vegan</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="dGluten" class="accent-amber-500"> 🌾 Glutenfrei</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="dLactose" class="accent-amber-500"> 🥛 Laktosefrei</label>
        </div>
      </div>

      <textarea id="dRecipe" placeholder="Zubereitung Schritt für Schritt..." class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2"></textarea>
      <input type="text" id="dVideo" placeholder="Video-URL (YouTube / MP4)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2">

      <!-- Featured / Bestseller Checkbox -->
      <div class="md:col-span-2 flex items-center p-3 bg-slate-900 rounded border border-slate-800 text-xs text-slate-300">
        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="dFeatured" class="accent-amber-500"> ⭐ <span id="lblFeatured">Als Bestseller / Highlight markieren</span></label>
      </div>
    </div>

    <div class="flex gap-3 mt-4">
      <button onclick="saveDrink()" id="saveBtn" class="px-6 py-3 bg-amber-500 hover:bg-amber-600 font-bold text-slate-950 rounded-lg">Getränk speichern</button>
      <button onclick="resetForm()" id="cancelEditBtn" class="hidden px-6 py-3 bg-slate-700 hover:bg-slate-600 font-bold text-white rounded-lg">Abbrechen</button>
    </div>
  </div>

  <!-- Drinks Grid / List Container -->
  <div id="drinksGrid">
    <p id="loadingTxt" class="col-span-full text-slate-400">Lade Getränke aus der Datenbank...</p>
  </div>

  <!-- Footer Credit -->
  <footer class="mt-20 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
    Salonplafond BAR App v1.7.8 • Erstellt von <span class="text-amber-400 font-semibold">© T0mc1k (Tomas Kardos)</span>
  </footer>

  <!-- Modal Detail View -->
  <div id="drinkModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="card max-w-2xl w-full max-h-[90vh] overflow-y-auto bg-slate-900 border-slate-700 p-6 relative flex flex-col justify-between">
      <div>
        <button onclick="closeModal()" class="no-print absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        <div id="modalContent"></div>
      </div>
      <div class="mt-6 pt-4 border-t border-slate-800 flex gap-2 no-print">
        <button onclick="window.print()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold rounded-xl transition text-sm flex items-center justify-center gap-2 border border-slate-700">
          🖨️ <span id="printBtnText">Drucken / PDF</span>
        </button>
        <button onclick="closeModal()" id="closeModalBtn" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition text-sm">Schließen</button>
      </div>
    </div>
  </div>

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('langDe').className = lang === 'de' ? 'px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950' : 'px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white';
      document.getElementById('langEn').className = lang === 'en' ? 'px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950' : 'px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white';
      updateUI();
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('viewGrid').className = mode === 'grid' ? 'px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950 flex items-center gap-1' : 'px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white flex items-center gap-1';
      document.getElementById('viewList').className = mode === 'list' ? 'px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950 flex items-center gap-1' : 'px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white flex items-center gap-1';
      renderDrinks();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function updateUI() {
      const t = i18n[currentLang];
      document.getElementById('subTitle').innerText = t.subTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('modeBtn').innerText = isAdmin ? t.managerMode : t.waiterMode;
      document.getElementById('fsText').innerText = t.fullscreen;
      document.getElementById('exportText').innerText = t.exportText;
      document.getElementById('catLabel').innerText = t.catLabel;
      document.getElementById('filterLabel').innerText = t.filterLabel;
      document.getElementById('catSelectLabel').innerText = t.catSelectLabel;
      document.getElementById('glassLabel').innerText = t.glassLabel;
      document.getElementById('costLabel').innerText = t.costLabel;
      document.getElementById('priceLabel').innerText = t.priceLabel;
      
      const editingId = document.getElementById('editingId').value;
      document.getElementById('formTitle').innerText = editingId ? t.formTitleEdit : t.formTitleAdd;
      
      document.getElementById('dName').placeholder = t.namePlaceholder;
      document.getElementById('dIng').placeholder = t.ingPlaceholder;
      document.getElementById('dAllergens').placeholder = t.allergensPlaceholder;
      document.getElementById('dRecipe').placeholder = t.recipePlaceholder;
      document.getElementById('photoLabel').innerText = t.photoLabel;
      document.getElementById('dVideo').placeholder = t.videoPlaceholder;
      document.getElementById('lblFeatured').innerText = t.lblFeatured;
      document.getElementById('saveBtn').innerText = t.saveBtn;
      document.getElementById('cancelEditBtn').innerText = t.cancelBtn;
      document.getElementById('closeModalBtn').innerText = t.closeBtn;
      document.getElementById('printBtnText').innerText = t.printBtn;
      renderCategories();
      renderDrinks();
    }

    function onSearchInput() {
      const val = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
      }
      renderDrinks();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      onSearchInput();
      input.focus();
    }

    function toggleSpecialFilter(filterType) {
      if (activeSpecialFilter === filterType) {
        activeSpecialFilter = null;
      } else {
        activeSpecialFilter = filterType;
      }
      
      const filterButtons = {
        featured: 'filterFeatured',
        vegan: 'filterVegan',
        glutenfree: 'filterGluten',
        lactosefree: 'filterLactose',
        nonalcoholic: 'filterNonAlc'
      };

      Object.values(filterButtons).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.className = 'px-3 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700 hover:border-amber-400 whitespace-nowrap';
      });

      if (activeSpecialFilter && filterButtons[activeSpecialFilter]) {
        const activeEl = document.getElementById(filterButtons[activeSpecialFilter]);
        if (activeEl) activeEl.className = 'px-3 py-1 rounded-full bg-amber-500 text-slate-950 font-bold border border-amber-400 whitespace-nowrap';
      }

      renderDrinks();
    }

    function exportToCSV() {
      if (!allDrinks || allDrinks.length === 0) {
        alert("Keine Getränke zum Exportieren vorhanden.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Name;Category;Glass;CostPrice;SellingPrice;Ingredients;Allergens;Recipe;Vegan;Glutenfree;Lactosefree;Featured\r\n";

      allDrinks.forEach(d => {
        let row = [
          `"${(d.name || '').replace(/"/g, '""')}"`,
          `"${(d.category || '').replace(/"/g, '""')}"`,
          `"${(d.glass_type || '').replace(/"/g, '""')}"`,
          d.cost_price || 0,
          d.selling_price || 0,
          `"${(d.ingredients || '').replace(/"/g, '""')}"`,
          `"${(d.allergens || '').replace(/"/g, '""')}"`,
          `"${(d.recipe || '').replace(/"/g, '""')}"`,
          d.is_vegan ? 'Yes' : 'No',
          d.is_glutenfree ? 'Yes' : 'No',
          d.is_lactosefree ? 'Yes' : 'No',
          d.is_featured ? 'Yes' : 'No'
        ];
        csvContent += row.join(";") + "\r\n";
      });

      let encodedUri = encodeURI(csvContent);
      let link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `salonplafond_bar_export_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    async function uploadImageToSupabase(event) {
      const file = event.target.files[0];
      if (!file) return;
      const t = i18n[currentLang];
      const status = document.getElementById('uploadStatus');
      status.innerText = t.uploading;

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

      let { error: uploadError } = await _supabase.storage.from('drinks').upload(fileName, file);

      if (uploadError) {
        console.error(uploadError);
        status.innerText = 'Upload Error: ' + uploadError.message;
        return;
      }

      const { data } = _supabase.storage.from('drinks').getPublicUrl(fileName);

      if (data && data.publicUrl) {
        document.getElementById('dPhoto').value = data.publicUrl;
        status.innerText = t.uploadSuccess;
      } else {
        status.innerText = 'URL Error';
      }
    }

    async function loadDrinks() {
      const { data, error } = await _supabase.from('drinks').select('*').order('created_at', { ascending: false });
      if (error) { console.error(error); return; }
      allDrinks = data || [];
      renderCategories();
      renderDrinks();
    }

    function renderCategories() {
      const t = i18n[currentLang];
      const allLabel = t.allCategories;
      const cats = [allLabel, ...new Set(allDrinks.map(d => d.category).filter(Boolean))];
      if (!cats.includes(selectedCat)) selectedCat = allLabel;

      const container = document.getElementById('categories');
      container.innerHTML = cats.map(c => `
        <button onclick="setCategory('${c}')" class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap ${selectedCat === c ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${c}</button>
      `).join('');
    }

    function setCategory(cat) { selectedCat = cat; renderDrinks(); renderCategories(); }

    function renderDrinks() {
      const t = i18n[currentLang];
      const search = document.getElementById('searchInput').value.toLowerCase();
      const allLabel = t.allCategories;

      let filtered = allDrinks.filter(d => {
        const matchesCat = selectedCat === allLabel || d.category === selectedCat;
        const matchesSearch = d.name.toLowerCase().includes(search) || 
                              (d.ingredients && d.ingredients.toLowerCase().includes(search)) ||
                              (d.allergens && d.allergens.toLowerCase().includes(search));
        
        let matchesFilter = true;
        if (activeSpecialFilter === 'featured') matchesFilter = d.is_featured;
        if (activeSpecialFilter === 'vegan') matchesFilter = d.is_vegan;
        if (activeSpecialFilter === 'glutenfree') matchesFilter = d.is_glutenfree;
        if (activeSpecialFilter === 'lactosefree') matchesFilter = d.is_lactosefree;
        if (activeSpecialFilter === 'nonalcoholic') matchesFilter = d.category && d.category.toLowerCase().includes('alkoholfrei');

        return matchesCat && matchesSearch && matchesFilter;
      });

      // Sort featured drinks to top
      filtered.sort((a, b) => (b.is_featured ? 1 : 0) - (a.is_featured ? 1 : 0));

      const container = document.getElementById('drinksGrid');
      if (filtered.length === 0) {
        container.className = 'block';
        container.innerHTML = '<p class="text-center text-slate-500 py-12">' + t.noDrinksFound + ' ' + (isAdmin ? t.addFirstDrink : '') + '</p>';
        return;
      }

      if (viewMode === 'grid') {
        container.className = 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6';
        container.innerHTML = filtered.map(d => {
          let photoHtml = d.photo_url 
            ? '<img src="' + d.photo_url + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="">' 
            : '<div class="flex items-center justify-center h-full text-slate-500 text-xs">' + t.noPhoto + '</div>';

          let badgeHtml = d.is_featured 
            ? '<span class="absolute top-2 right-2 text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500 text-slate-950 shadow">⭐ TOP</span>' 
            : '';

          let tagsHtml = '';
          if (d.is_vegan) tagsHtml += '🌱 ';
          if (d.is_glutenfree) tagsHtml += '🌾 ';
          if (d.is_lactosefree) tagsHtml += '🥛 ';

          return '<div onclick="openDrinkModal(\'' + d.id + '\')" class="card overflow-hidden cursor-pointer flex flex-col justify-between group">' +
                 '<div class="relative h-48 bg-slate-800">' + photoHtml + badgeHtml +
                 '<span class="absolute top-2 left-2 text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-900/80 backdrop-blur text-amber-400 border border-amber-500/30">' + (d.category || t.defaultDrinkCat) + '</span>' +
                 '</div>' +
                 '<div class="p-4 text-center">' +
                 '<h3 class="text-lg font-bold text-white group-hover:text-amber-400 transition">' + d.name + '</h3>' +
                 (tagsHtml ? '<div class="text-xs mt-1">' + tagsHtml + '</div>' : '') +
                 '<span class="text-xs text-slate-400 mt-1 inline-block">' + t.clickToView + '</span>' +
                 '</div>' +
                 '</div>';
        }).join('');
      } else {
        // List Mode
        container.className = 'flex flex-col gap-3';
        container.innerHTML = filtered.map(d => {
          let photoHtml = d.photo_url 
            ? '<img src="' + d.photo_url + '" class="w-14 h-14 object-cover rounded-lg shrink-0" alt="">' 
            : '<div class="w-14 h-14 bg-slate-800 rounded-lg shrink-0 flex items-center justify-center text-[10px] text-slate-500">No Pic</div>';

          let tagsHtml = '';
          if (d.is_featured) tagsHtml += '<span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-500 text-slate-950">⭐ TOP</span>';
          if (d.is_vegan) tagsHtml += '<span class="text-xs">🌱</span>';
          if (d.is_glutenfree) tagsHtml += '<span class="text-xs">🌾</span>';
          if (d.is_lactosefree) tagsHtml += '<span class="text-xs">🥛</span>';

          return '<div onclick="openDrinkModal(\'' + d.id + '\')" class="list-item p-3 cursor-pointer flex items-center justify-between gap-4 group">' +
                 '<div class="flex items-center gap-4 min-w-0">' + photoHtml +
                 '<div class="min-w-0">' +
                 '<div class="flex items-center gap-2 flex-wrap">' +
                 '<h3 class="text-base font-bold text-white group-hover:text-amber-400 transition truncate">' + d.name + '</h3>' + tagsHtml +
                 '</div>' +
                 '<p class="text-xs text-slate-400 truncate mt-0.5">' + (d.ingredients || (d.category || t.defaultDrinkCat)) + '</p>' +
                 '</div>' +
                 '</div>' +
                 '<span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-amber-400 border border-slate-700 shrink-0">' + (d.category || t.defaultDrinkCat) + '</span>' +
                 '</div>';
        }).join('');
      }
    }

    function getEmbedUrl(url) {
      if (!url) return '';
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let videoId = '';
        if (url.includes('youtu.be/')) {
          videoId = url.split('youtu.be/')[1].split('?')[0];
        } else if (url.includes('watch?v=')) {
          videoId = url.split('watch?v=')[1].split('&')[0];
        }
        if (videoId) return 'https://www.youtube.com/embed/' + videoId;
      }
      return url;
    }

    function openDrinkModal(id) {
      const d = allDrinks.find(item => item.id === id);
      if (!d) return;
      const t = i18n[currentLang];

      let html = '';
      if (d.photo_url) {
        html += '<img src="' + d.photo_url + '" class="w-full h-64 object-cover rounded-xl mb-4 shadow" alt="">';
      }
      html += '<div class="flex items-center gap-2 mb-2">';
      html += '<span class="text-xs font-semibold px-2.5 py-1 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">' + (d.category || t.defaultDrinkCat) + '</span>';
      if (d.is_featured) html += '<span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-500 text-slate-950">⭐ TOP Highlight</span>';
      html += '</div>';

      html += '<h2 class="text-3xl font-bold text-white mb-4">' + d.name + '</h2>';

      let tags = [];
      if (d.is_vegan) tags.push('🌱 Vegan');
      if (d.is_glutenfree) tags.push('🌾 Glutenfrei');
      if (d.is_lactosefree) tags.push('🥛 Laktosefrei');
      if (tags.length > 0) {
        html += '<div class="flex gap-2 mb-4 text-xs text-slate-300">' + tags.map(tg => '<span class="px-2 py-0.5 bg-slate-800 rounded-md border border-slate-700">' + tg + '</span>').join('') + '</div>';
      }

      // Glass Type Display if present
      if (d.glass_type) {
        html += '<div class="mb-4 text-xs text-slate-300 flex items-center gap-1.5 bg-slate-800/40 p-2.5 rounded-lg border border-slate-700">';
        html += '<span>🍸 ' + (currentLang === 'de' ? 'Glas / Ausrüstung:' : 'Glass / Equipment:') + '</span> <strong class="text-amber-400">' + d.glass_type + '</strong>';
        html += '</div>';
      }

      if (d.ingredients) {
        html += '<div class="print-box mb-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-white">';
        html += '<p class="text-sm font-bold mb-1 text-amber-400">' + t.ingredientsLabel + '</p>';
        html += '<p class="text-sm text-slate-200">' + d.ingredients + '</p>';
        html += '</div>';
      }

      if (d.allergens) {
        html += '<div class="print-box mb-4 bg-amber-500/10 p-4 rounded-xl border border-amber-500/30 text-white">';
        html += '<p class="text-sm font-bold mb-1 text-amber-400">' + t.allergensLabel + '</p>';
        html += '<p class="text-sm text-slate-200">' + d.allergens + '</p>';
        html += '</div>';
      }

      if (d.recipe) {
        html += '<div class="print-box mb-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-white">';
        html += '<p class="text-sm font-bold mb-1 text-amber-400">' + t.recipeLabel + '</p>';
        html += '<p class="text-sm text-slate-200 whitespace-pre-line">' + d.recipe + '</p>';
        html += '</div>';
      }

      // Manager-only Food Cost / Price view inside modal
      if (isAdmin && (d.cost_price || d.selling_price)) {
        let cost = parseFloat(d.cost_price) || 0;
        let price = parseFloat(d.selling_price) || 0;
        let margin = price > 0 ? (((price - cost) / price) * 100).toFixed(1) : 0;
        html += '<div class="mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs flex flex-wrap gap-4 text-slate-300 no-print">';
        if (cost > 0) html += '<div>💶 ' + t.costDisplay + ' <b>' + cost.toFixed(2) + ' €</b></div>';
        if (price > 0) html += '<div>🏷️ ' + t.priceDisplay + ' <b>' + price.toFixed(2) + ' €</b></div>';
        if (price > 0 && cost > 0) html += '<div>📈 ' + t.marginDisplay + ' <b class="text-amber-400">' + margin + ' %</b></div>';
        html += '</div>';
      }

      if (d.video_url) {
        let embed = getEmbedUrl(d.video_url);
        html += '<div class="mt-4 no-print"><p class="text-sm text-slate-200 font-medium mb-2">▶ Video:</p>';
        if (embed.includes('youtube.com/embed')) {
          html += '<div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black"><iframe src="' + embed + '" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>';
        } else {
          html += '<video src="' + d.video_url + '" controls class="w-full rounded-xl max-h-80 bg-black"></video>';
        }
        html += '</div>';
      }

      // Last updated info & Manager buttons
      html += '<div class="mt-6 pt-4 border-t border-slate-700 flex flex-wrap items-center justify-between gap-2">';
      if (d.updated_at) {
        let dateStr = new Date(d.updated_at).toLocaleDateString();
        html += '<span class="text-[11px] text-slate-500">' + t.lastUpdated + ' ' + dateStr + '</span>';
      } else {
        html += '<span></span>';
      }

      if (isAdmin) {
        html += '<div class="flex gap-2 no-print">';
        html += '<button onclick="event.stopPropagation(); duplicateDrink(\'' + d.id + '\')" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700 transition">📄 ' + t.duplicateBtn + '</button>';
        html += '<button onclick="event.stopPropagation(); editDrink(\'' + d.id + '\')" class="px-3 py-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs font-semibold rounded-lg border border-amber-500/20 transition">' + t.editBtn + '</button>';
        html += '<button onclick="event.stopPropagation(); deleteDrink(\'' + d.id + '\')" class="px-3 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-lg border border-red-500/20 transition">' + t.deleteBtn + '</button>';
        html += '</div>';
      }
      html += '</div>';

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('drinkModal').classList.remove('hidden');
      document.getElementById('drinkModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('drinkModal').classList.remove('flex');
      document.getElementById('drinkModal').classList.add('hidden');
    }

    function toggleMode() {
      const t = i18n[currentLang];
      if (!isAdmin) {
        let pass = prompt(t.passPrompt);
        if (pass === null) return;
        if (pass !== MANAGER_PASSWORD) {
          alert(t.passWrong);
          return;
        }
        isAdmin = true;
      } else {
        isAdmin = false;
      }

      document.getElementById('modeBtn').innerText = isAdmin ? t.managerMode : t.waiterMode;
      document.getElementById('adminForm').classList.toggle('hidden', !isAdmin);
      if (!isAdmin) resetForm();
      renderDrinks();
    }

    function editDrink(id) {
      const d = allDrinks.find(item => item.id === id);
      if (!d) return;
      closeModal();
      
      document.getElementById('editingId').value = d.id;
      document.getElementById('dName').value = d.name || '';
      
      const radios = document.getElementsByName('dCatRadio');
      for (let r of radios) r.checked = (r.value === d.category);

      document.getElementById('dGlass').value = d.glass_type || '';
      document.getElementById('dCost').value = d.cost_price || '';
      document.getElementById('dPrice').value = d.selling_price || '';
      document.getElementById('dIng').value = d.ingredients || '';
      document.getElementById('dAllergens').value = d.allergens || '';
      document.getElementById('dRecipe').value = d.recipe || '';
      document.getElementById('dPhoto').value = d.photo_url || '';
      document.getElementById('dVideo').value = d.video_url || '';
      
      document.getElementById('dFeatured').checked = !!d.is_featured;
      document.getElementById('dVegan').checked = !!d.is_vegan;
      document.getElementById('dGluten').checked = !!d.is_glutenfree;
      document.getElementById('dLactose').checked = !!d.is_lactosefree;
      
      const t = i18n[currentLang];
      document.getElementById('formTitle').innerText = t.formTitleEdit;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      
      if (!isAdmin) {
        let pass = prompt(t.passPrompt);
        if (pass !== MANAGER_PASSWORD) { alert(t.passWrong); return; }
        isAdmin = true;
        document.getElementById('modeBtn').innerText = t.managerMode;
        document.getElementById('adminForm').classList.remove('hidden');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function duplicateDrink(id) {
      const d = allDrinks.find(item => item.id === id);
      if (!d) return;
      closeModal();
      
      document.getElementById('editingId').value = '';
      document.getElementById('dName').value = (d.name || '') + ' (Kopie)';
      
      const radios = document.getElementsByName('dCatRadio');
      for (let r of radios) r.checked = (r.value === d.category);

      document.getElementById('dGlass').value = d.glass_type || '';
      document.getElementById('dCost').value = d.cost_price || '';
      document.getElementById('dPrice').value = d.selling_price || '';
      document.getElementById('dIng').value = d.ingredients || '';
      document.getElementById('dAllergens').value = d.allergens || '';
      document.getElementById('dRecipe').value = d.recipe || '';
      document.getElementById('dPhoto').value = d.photo_url || '';
      document.getElementById('dVideo').value = d.video_url || '';
      
      document.getElementById('dFeatured').checked = !!d.is_featured;
      document.getElementById('dVegan').checked = !!d.is_vegan;
      document.getElementById('dGluten').checked = !!d.is_glutenfree;
      document.getElementById('dLactose').checked = !!d.is_lactosefree;
      
      const t = i18n[currentLang];
      document.getElementById('formTitle').innerText = t.formTitleAdd;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      
      if (!isAdmin) {
        let pass = prompt(t.passPrompt);
        if (pass !== MANAGER_PASSWORD) { alert(t.passWrong); return; }
        isAdmin = true;
        document.getElementById('modeBtn').innerText = t.managerMode;
        document.getElementById('adminForm').classList.remove('hidden');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editingId').value = '';
      document.getElementById('dName').value = '';
      
      const radios = document.getElementsByName('dCatRadio');
      for (let r of radios) r.checked = false;

      document.getElementById('dGlass').value = '';
      document.getElementById('dCost').value = '';
      document.getElementById('dPrice').value = '';
      document.getElementById('dIng').value = '';
      document.getElementById('dAllergens').value = '';
      document.getElementById('dRecipe').value = '';
      document.getElementById('dPhoto').value = '';
      document.getElementById('dVideo').value = '';
      document.getElementById('imageFile').value = '';
      document.getElementById('uploadStatus').innerText = '';
      
      document.getElementById('dFeatured').checked = false;
      document.getElementById('dVegan').checked = false;
      document.getElementById('dGluten').checked = false;
      document.getElementById('dLactose').checked = false;
      
      const t = i18n[currentLang];
      document.getElementById('formTitle').innerText = t.formTitleAdd;
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    async function saveDrink() {
      const t = i18n[currentLang];
      const id = document.getElementById('editingId').value;
      const name = document.getElementById('dName').value;
      
      let category = '';
      const radios = document.getElementsByName('dCatRadio');
      for (let r of radios) {
        if (r.checked) {
          category = r.value;
          break;
        }
      }

      const glass_type = document.getElementById('dGlass').value;
      const cost_price = parseFloat(document.getElementById('dCost').value) || null;
      const selling_price = parseFloat(document.getElementById('dPrice').value) || null;
      const ingredients = document.getElementById('dIng').value;
      const allergens = document.getElementById('dAllergens').value;
      const recipe = document.getElementById('dRecipe').value;
      const photo_url = document.getElementById('dPhoto').value;
      const video_url = document.getElementById('dVideo').value;

      const is_featured = document.getElementById('dFeatured').checked;
      const is_vegan = document.getElementById('dVegan').checked;
      const is_glutenfree = document.getElementById('dGluten').checked;
      const is_lactosefree = document.getElementById('dLactose').checked;
      const updated_at = new Date().toISOString();

      if (!name || !category) { alert(t.alertFill); return; }

      const drinkObj = { name, category, glass_type, cost_price, selling_price, ingredients, allergens, recipe, photo_url, video_url, is_featured, is_vegan, is_glutenfree, is_lactosefree, updated_at };

      if (id) {
        await _supabase.from('drinks').update(drinkObj).eq('id', id);
      } else {
        await _supabase.from('drinks').insert([drinkObj]);
      }
      
      resetForm();
      loadDrinks();
    }

    async function deleteDrink(id) {
      const t = i18n[currentLang];
      if (confirm(t.confirmDelete)) {
        await _supabase.from('drinks').delete().eq('id', id);
        closeModal();
        loadDrinks();
      }
    }

    loadDrinks();
  </script>
</body>
