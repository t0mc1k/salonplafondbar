<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salonplafond BAR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 1rem; transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #f59e0b; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto pb-24">

  <!-- Header -->
  <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 pb-4 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <!-- Salonplafond Stylized Logo -->
      <div class="w-12 h-12 bg-amber-400 rounded-xl flex items-center justify-center shadow-lg p-2 text-slate-950 font-bold text-2xl select-none">
        Ō
      </div>
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-amber-400">Salonplafond BAR</h1>
        <span class="text-xs text-slate-400 font-medium">Erstellt von © T0mc1k</span>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
        <button onclick="setLang('de')" id="langDe" class="px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950">DE</button>
        <button onclick="setLang('en')" id="langEn" class="px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white">EN</button>
      </div>

      <!-- Search Box with Clear Button (x) -->
      <div class="relative w-48 md:w-64">
        <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="🔍 Suchen..." class="px-4 py-2 pr-8 rounded-lg bg-slate-800 border border-slate-700 text-white w-full focus:outline-none focus:border-amber-400">
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm font-bold bg-slate-700/50 hover:bg-slate-700 w-5 h-5 rounded-full items-center justify-center">&times;</button>
      </div>

      <button onclick="toggleMode()" id="modeBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-semibold border border-slate-600">Modus: Kellner</button>
    </div>
  </header>

  <p id="subTitle" class="text-sm text-slate-400 mb-6 -mt-4">Salonplafond • Rezepte & Getränkehandbuch</p>

  <!-- Categories -->
  <div id="categories" class="flex gap-2 overflow-x-auto pb-4 mb-6"></div>

  <!-- Manager Add / Edit Form -->
  <div id="adminForm" class="hidden card p-6 mb-8 border-amber-500/50">
    <h2 id="formTitle" class="text-xl font-bold mb-4 text-amber-400">➕ Neues Getränk hinzufügen</h2>
    <input type="hidden" id="editingId" value="">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="text" id="dName" placeholder="Getränkename (z. B. Aperol Spritz)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white">
      <input type="text" id="dCat" placeholder="Kategorie (Cocktails, Kaffee, Alkoholfrei...)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white">
      
      <!-- Supabase Photo Upload Section -->
      <div class="md:col-span-2 bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col gap-2">
        <label class="text-xs text-slate-400 font-semibold" id="photoLabel">📸 Foto des Getränks (Direkt hochladen oder URL eingeben):</label>
        <div class="flex gap-2 items-center">
          <input type="file" id="imageFile" accept="image/*" onchange="uploadImageToSupabase(event)" class="text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 cursor-pointer">
          <span id="uploadStatus" class="text-xs text-amber-400 font-medium"></span>
        </div>
        <input type="text" id="dPhoto" placeholder="Bild-URL (wird automatisch generiert oder manuell)" class="p-3 rounded bg-slate-950 border border-slate-800 text-white text-xs mt-1">
      </div>

      <textarea id="dIng" placeholder="Zutaten & Allergene (z. B. Prosecco 9cl, Aperol 6cl, Soda 3cl)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2"></textarea>
      <textarea id="dRecipe" placeholder="Zubereitung Schritt für Schritt..." class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2"></textarea>
      <input type="text" id="dVideo" placeholder="Video-URL (YouTube / MP4)" class="p-3 rounded bg-slate-900 border border-slate-700 text-white md:col-span-2">
    </div>
    <div class="flex gap-3 mt-4">
      <button onclick="saveDrink()" id="saveBtn" class="px-6 py-3 bg-amber-500 hover:bg-amber-600 font-bold text-slate-950 rounded-lg">Getränk speichern</button>
      <button onclick="resetForm()" id="cancelEditBtn" class="hidden px-6 py-3 bg-slate-700 hover:bg-slate-600 font-bold text-white rounded-lg">Abbrechen</button>
    </div>
  </div>

  <!-- Drinks Grid -->
  <div id="drinksGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <p id="loadingTxt" class="col-span-full text-slate-400">Lade Getränke aus der Datenbank...</p>
  </div>

  <!-- Footer Credit -->
  <footer class="mt-20 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
    Salonplafond BAR App v1.5 • Erstellt von <span class="text-amber-400 font-semibold">© T0mc1k</span>
  </footer>

  <!-- Modal Detail View -->
  <div id="drinkModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="card max-w-2xl w-full max-h-[90vh] overflow-y-auto bg-slate-900 border-slate-700 p-6 relative flex flex-col justify-between">
      <div>
        <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        <div id="modalContent"></div>
      </div>
      <div class="mt-6 pt-4 border-t border-slate-800">
        <button onclick="closeModal()" id="closeModalBtn" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition text-sm">Schließen</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://asrrkjcxqqvxzlikdkaq.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2tw50zmlzxDClPx7zwnT3g_k2WiaUuL";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentLang = 'de';
    let allDrinks = [];
    let selectedCat = 'All';
    let isAdmin = false;
    const MANAGER_PASSWORD = "salon123";

    const i18n = {
      de: {
        subTitle: "Salonplafond • Rezepte & Getränkehandbuch",
        searchPlaceholder: "🔍 Getränk oder Rezept suchen...",
        waiterMode: "Modus: Kellner",
        managerMode: "Modus: Manager",
        allCategories: "Alle",
        formTitleAdd: "➕ Neues Getränk hinzufügen",
        formTitleEdit: "✏️ Getränk bearbeiten",
        namePlaceholder: "Getränkename (z. B. Aperol Spritz)",
        catPlaceholder: "Kategorie (Cocktails, Kaffee, Alkoholfrei...)",
        ingPlaceholder: "Zutaten & Allergene (z. B. Prosecco 9cl, Aperol 6cl, Soda 3cl)",
        recipePlaceholder: "Zubereitung Schritt für Schritt...",
        photoLabel: "📸 Foto des Getränks (Direkt hochladen oder URL eingeben):",
        videoPlaceholder: "Video-URL (YouTube / MP4)",
        saveBtn: "Getränk speichern",
        cancelBtn: "Abbrechen",
        closeBtn: "Schließen",
        loading: "Lade Getränke aus der Datenbank...",
        noDrinksFound: "Keine Getränke gefunden.",
        addFirstDrink: "Fügen Sie oben das erste Getränk hinzu!",
        ingredientsLabel: "📋 Zutaten & Allergene:",
        recipeLabel: "🥣 Zubereitung:",
        deleteBtn: "Getränk löschen",
        editBtn: "Getränk bearbeiten",
        alertFill: "Bitte geben Sie den Namen und die Kategorie des Getränks ein.",
        confirmDelete: "Möchten Sie dieses Getränk wirklich löschen?",
        passPrompt: "Bitte geben Sie das Manager-Passwort ein:",
        passWrong: "Falsches Passwort!",
        defaultDrinkCat: "Getränk",
        clickToView: "Klicken für Rezept",
        noPhoto: "Kein Bild",
        uploading: "Wird hochgeladen...",
        uploadSuccess: "✔ Foto erfolgreich hochgeladen!"
      },
      en: {
        subTitle: "Salonplafond • Recipes & Drinks Manual",
        searchPlaceholder: "🔍 Search drink or recipe...",
        waiterMode: "Mode: Waiter",
        managerMode: "Mode: Manager",
        allCategories: "All",
        formTitleAdd: "➕ Add New Drink",
        formTitleEdit: "✏️ Edit Drink",
        namePlaceholder: "Drink name (e.g. Aperol Spritz)",
        catPlaceholder: "Category (Cocktails, Coffee, Non-Alcoholic...)",
        ingPlaceholder: "Ingredients & Allergens (e.g. Prosecco 9cl, Aperol 6cl, Soda 3cl)",
        recipePlaceholder: "Preparation step by step...",
        photoLabel: "📸 Drink Photo (Upload directly or enter URL):",
        videoPlaceholder: "Video URL (YouTube / MP4)",
        saveBtn: "Save Drink",
        cancelBtn: "Cancel",
        closeBtn: "Close",
        loading: "Loading drinks from database...",
        noDrinksFound: "No drinks found.",
        addFirstDrink: "Add the first drink using the form above!",
        ingredientsLabel: "📋 Ingredients & Allergens:",
        recipeLabel: "🥣 Preparation:",
        deleteBtn: "Delete Drink",
        editBtn: "Edit Drink",
        alertFill: "Please enter the drink name and category.",
        confirmDelete: "Do you really want to delete this drink?",
        passPrompt: "Please enter the manager password:",
        passWrong: "Wrong password!",
        defaultDrinkCat: "Drink",
        clickToView: "Click for recipe",
        noPhoto: "No photo",
        uploading: "Uploading...",
        uploadSuccess: "✔ Photo successfully uploaded!"
      }
    };

    function setLang(lang) {
      currentLang = lang;
      document.getElementById('langDe').className = lang === 'de' ? 'px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950' : 'px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white';
      document.getElementById('langEn').className = lang === 'en' ? 'px-2.5 py-1 text-xs font-bold rounded bg-amber-500 text-slate-950' : 'px-2.5 py-1 text-xs font-bold rounded text-slate-400 hover:text-white';
      updateUI();
    }

    function updateUI() {
      const t = i18n[currentLang];
      document.getElementById('subTitle').innerText = t.subTitle;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('modeBtn').innerText = isAdmin ? t.managerMode : t.waiterMode;
      
      const editingId = document.getElementById('editingId').value;
      document.getElementById('formTitle').innerText = editingId ? t.formTitleEdit : t.formTitleAdd;
      
      document.getElementById('dName').placeholder = t.namePlaceholder;
      document.getElementById('dCat').placeholder = t.catPlaceholder;
      document.getElementById('dIng').placeholder = t.ingPlaceholder;
      document.getElementById('dRecipe').placeholder = t.recipePlaceholder;
      document.getElementById('photoLabel').innerText = t.photoLabel;
      document.getElementById('dVideo').placeholder = t.videoPlaceholder;
      document.getElementById('saveBtn').innerText = t.saveBtn;
      document.getElementById('cancelEditBtn').innerText = t.cancelBtn;
      document.getElementById('closeModalBtn').innerText = t.closeBtn;
      renderCategories();
      renderDrinks();
    }

    function onSearchInput() {
      const val = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
      }
      renderDrinks();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      onSearchInput();
      input.focus();
    }

    async function uploadImageToSupabase(event) {
      const file = event.target.files[0];
      if (!file) return;
      const t = i18n[currentLang];
      const status = document.getElementById('uploadStatus');
      status.innerText = t.uploading;

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

      let { error: uploadError } = await _supabase.storage.from('drinks').upload(fileName, file);

      if (uploadError) {
        console.error(uploadError);
        status.innerText = 'Upload Error: ' + uploadError.message;
        return;
      }

      const { data } = _supabase.storage.from('drinks').getPublicUrl(fileName);

      if (data && data.publicUrl) {
        document.getElementById('dPhoto').value = data.publicUrl;
        status.innerText = t.uploadSuccess;
      } else {
        status.innerText = 'URL Error';
      }
    }

    async function loadDrinks() {
      const { data, error } = await _supabase.from('drinks').select('*').order('created_at', { ascending: false });
      if (error) { console.error(error); return; }
      allDrinks = data || [];
      renderCategories();
      renderDrinks();
    }

    function renderCategories() {
      const t = i18n[currentLang];
      const allLabel = t.allCategories;
      const cats = [allLabel, ...new Set(allDrinks.map(d => d.category).filter(Boolean))];
      if (!cats.includes(selectedCat)) selectedCat = allLabel;

      const container = document.getElementById('categories');
      container.innerHTML = cats.map(c => `
        <button onclick="setCategory('${c}')" class="px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap ${selectedCat === c ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${c}</button>
      `).join('');
    }

    function setCategory(cat) { selectedCat = cat; renderDrinks(); renderCategories(); }
    function filterDrinks() { renderDrinks(); }

    function renderDrinks() {
      const t = i18n[currentLang];
      const search = document.getElementById('searchInput').value.toLowerCase();
      const allLabel = t.allCategories;

      const filtered = allDrinks.filter(d => {
        const matchesCat = selectedCat === allLabel || d.category === selectedCat;
        const matchesSearch = d.name.toLowerCase().includes(search) || (d.ingredients && d.ingredients.toLowerCase().includes(search));
        return matchesCat && matchesSearch;
      });

      const container = document.getElementById('drinksGrid');
      if (filtered.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center text-slate-500 py-12">' + t.noDrinksFound + ' ' + (isAdmin ? t.addFirstDrink : '') + '</p>';
        return;
      }

      container.innerHTML = filtered.map(d => {
        let photoHtml = d.photo_url 
          ? '<img src="' + d.photo_url + '" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="">' 
          : '<div class="flex items-center justify-center h-full text-slate-500 text-xs">' + t.noPhoto + '</div>';

        return '<div onclick="openDrinkModal(\'' + d.id + '\')" class="card overflow-hidden cursor-pointer flex flex-col justify-between group">' +
               '<div class="relative h-48 bg-slate-800">' + photoHtml +
               '<span class="absolute top-2 left-2 text-[10px] font-semibold px-2 py-0.5 rounded bg-slate-900/80 backdrop-blur text-amber-400 border border-amber-500/30">' + (d.category || t.defaultDrinkCat) + '</span>' +
               '</div>' +
               '<div class="p-4 text-center">' +
               '<h3 class="text-lg font-bold text-white group-hover:text-amber-400 transition">' + d.name + '</h3>' +
               '<span class="text-xs text-slate-400 mt-1 inline-block">' + t.clickToView + '</span>' +
               '</div>' +
               '</div>';
      }).join('');
    }

    function getEmbedUrl(url) {
      if (!url) return '';
      if (url.includes('youtube.com') || url.includes('youtu.be')) {
        let videoId = '';
        if (url.includes('youtu.be/')) {
          videoId = url.split('youtu.be/')[1].split('?')[0];
        } else if (url.includes('watch?v=')) {
          videoId = url.split('watch?v=')[1].split('&')[0];
        }
        if (videoId) {
          return 'https://www.youtube.com/embed/' + videoId;
        }
      }
      return url;
    }

    function openDrinkModal(id) {
      const d = allDrinks.find(item => item.id === id);
      if (!d) return;
      const t = i18n[currentLang];

      let html = '';
      if (d.photo_url) {
        html += '<img src="' + d.photo_url + '" class="w-full h-64 object-cover rounded-xl mb-4" alt="">';
      }
      html += '<span class="text-xs font-semibold px-2.5 py-1 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">' + (d.category || t.defaultDrinkCat) + '</span>';
      html += '<h2 class="text-2xl font-bold mt-2 text-white">' + d.name + '</h2>';

      if (d.ingredients) {
        html += '<div class="mt-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700">';
        html += '<p class="text-sm text-slate-200 font-medium">' + t.ingredientsLabel + '</p>';
        html += '<p class="text-sm text-slate-300 mt-1">' + d.ingredients + '</p>';
        html += '</div>';
      }

      if (d.recipe) {
        html += '<div class="mt-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700">';
        html += '<p class="text-sm text-slate-200 font-medium">' + t.recipeLabel + '</p>';
        html += '<p class="text-sm text-slate-300 mt-1 whitespace-pre-line">' + d.recipe + '</p>';
        html += '</div>';
      }

      if (d.video_url) {
        let embed = getEmbedUrl(d.video_url);
        html += '<div class="mt-4"><p class="text-sm text-slate-200 font-medium mb-2">▶ Video:</p>';
        if (embed.includes('youtube.com/embed')) {
          html += '<div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black"><iframe src="' + embed + '" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>';
        } else {
          html += '<video src="' + d.video_url + '" controls class="w-full rounded-xl max-h-80 bg-black"></video>';
        }
        html += '</div>';
      }

      if (isAdmin) {
        html += '<div class="mt-6 pt-4 border-t border-slate-800 flex justify-end gap-2">';
        html += '<button onclick="event.stopPropagation(); editDrink(\'' + d.id + '\')" class="px-4 py-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs font-semibold rounded-lg border border-amber-500/20 transition">' + t.editBtn + '</button>';
        html += '<button onclick="event.stopPropagation(); deleteDrink(\'' + d.id + '\')" class="px-4 py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold rounded-lg border border-red-500/20 transition">' + t.deleteBtn + '</button>';
        html += '</div>';
      }

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('drinkModal').classList.remove('hidden');
      document.getElementById('drinkModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('drinkModal').classList.remove('flex');
      document.getElementById('drinkModal').classList.add('hidden');
    }

    function toggleMode() {
      const t = i18n[currentLang];
      if (!isAdmin) {
        let pass = prompt(t.passPrompt);
        if (pass === null) return;
        if (pass !== MANAGER_PASSWORD) {
          alert(t.passWrong);
          return;
        }
        isAdmin = true;
      } else {
        isAdmin = false;
      }

      document.getElementById('modeBtn').innerText = isAdmin ? t.managerMode : t.waiterMode;
      document.getElementById('adminForm').classList.toggle('hidden', !isAdmin);
      if (!isAdmin) resetForm();
      renderDrinks();
    }

    function editDrink(id) {
      const d = allDrinks.find(item => item.id === id);
      if (!d) return;
      closeModal();
      
      document.getElementById('editingId').value = d.id;
      document.getElementById('dName').value = d.name || '';
      document.getElementById('dCat').value = d.category || '';
      document.getElementById('dIng').value = d.ingredients || '';
      document.getElementById('dRecipe').value = d.recipe || '';
      document.getElementById('dPhoto').value = d.photo_url || '';
      document.getElementById('dVideo').value = d.video_url || '';
      
      const t = i18n[currentLang];
      document.getElementById('formTitle').innerText = t.formTitleEdit;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      
      if (!isAdmin) {
        let pass = prompt(t.passPrompt);
        if (pass !== MANAGER_PASSWORD) { alert(t.passWrong); return; }
        isAdmin = true;
        document.getElementById('modeBtn').innerText = t.managerMode;
        document.getElementById('adminForm').classList.remove('hidden');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editingId').value = '';
      document.getElementById('dName').value = '';
      document.getElementById('dCat').value = '';
      document.getElementById('dIng').value = '';
      document.getElementById('dRecipe').value = '';
      document.getElementById('dPhoto').value = '';
      document.getElementById('dVideo').value = '';
      document.getElementById('imageFile').value = '';
      document.getElementById('uploadStatus').innerText = '';
      
      const t = i18n[currentLang];
      document.getElementById('formTitle').innerText = t.formTitleAdd;
      document.getElementById('cancelEditBtn').classList.add('hidden');
    }

    async function saveDrink() {
      const t = i18n[currentLang];
      const id = document.getElementById('editingId').value;
      const name = document.getElementById('dName').value;
      const category = document.getElementById('dCat').value;
      const ingredients = document.getElementById('dIng').value;
      const recipe = document.getElementById('dRecipe').value;
      const photo_url = document.getElementById('dPhoto').value;
      const video_url = document.getElementById('dVideo').value;

      if (!name || !category) { alert(t.alertFill); return; }

      if (id) {
        await _supabase.from('drinks').update({ name, category, ingredients, recipe, photo_url, video_url }).eq('id', id);
      } else {
        await _supabase.from('drinks').insert([{ name, category, ingredients, recipe, photo_url, video_url }]);
      }
      
      resetForm();
      loadDrinks();
    }

    async function deleteDrink(id) {
      const t = i18n[currentLang];
      if (confirm(t.confirmDelete)) {
        await _supabase.from('drinks').delete().eq('id', id);
        closeModal();
        loadDrinks();
      }
    }

    loadDrinks();
  </script>
</body>
</html>
